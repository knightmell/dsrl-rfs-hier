defaults:
  - p6_walker_fresh_2p5m_cotrain
  - _self_

# Source-only Phase-B diagnosis.  The declared training target remains 2.5M
# so the frozen schedule is unchanged; this attempt intentionally stops at
# 250k, before the 500k BASE/RESIDUAL boundary.
name: base_diag_qw_current_k1_pilot250k_${p6.init_checkpoint_id}_${env_name}_${p6.algorithm_label}_seed${seed}_${total_timesteps}chunks

train:
  rfs_hier_qw_teacher_source: current_actor

p6:
  stop_after_chunk_transitions: 250000
  online_eval_interval_chunk_transitions: 50000
  model_checkpoint_interval_chunk_transitions: 50000
  replay_checkpoint_interval_chunk_transitions: 250000
