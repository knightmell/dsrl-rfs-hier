# Production 2.5M matched flat-DSRL control for the fresh VS-Hier protocol.

defaults:
  - p6_halfcheetah
  - _self_

algorithm: dsrl_na
name: fresh_frozen_ddim_cotrain_${env_name}_dsrl_na_control_seed${seed}_${total_timesteps}chunks
total_timesteps: 2500000
rfs_hier_legacy_checkpoint_path: null

train:
  train_freq: 1

p6:
  algorithm_label: dsrl_na_control
  prefill_source: fresh_frozen_ddim
  init_checkpoint_id: fresh_frozen_ddim
  init_checkpoint_sha256: null
  expected_init_checkpoint_steps: 0

