# Fresh Frozen-DDIM 2.5M co-training P6 run (three-critic Core V1).
#
# User-design co-training schedule: a short Phase B (0.5M) establishes the base
# branch AND shadow-trains QA_joint on the same BASE transitions (beta=0, so
# QA_joint's valid action IS the base action); the long Phase R (2.0M)
# co-trains both branches at the same time — QA_base->QW->noise/alpha continue
# at low frequency while QA_joint->residual trains — with beta held at 0 for
# the first 50k (collect joint data, warm QA_joint, residual OFF) then ramped
# 0.02->0.1 over the next 50k.  Frozen beta_target/base_lane/min_branch are
# unchanged.  See the deviation register in STAGED_DELIVERY_PLAN.md §7a.
#
# Launch (see RUNBOOK_2P5M_FRESH.md):
#   python p6_train.py --config-name p6_hopper_fresh_2p5m_cotrain \
#     seed=1 total_timesteps=2500000

defaults:
  - p6_hopper
  - _self_

name: fresh_frozen_ddim_cotrain_dsrl_na_rfs_hier_seed${seed}_${total_timesteps}chunks
total_timesteps: 2500000

# No legacy DSRL checkpoint: from-scratch init (spec 8.1).
rfs_hier_legacy_checkpoint_path: null

train:
  rfs_hier_schedule_profile: fresh_frozen_ddim_2p5m_cotrain
  rfs_hier_phase_b_steps: 500000
  rfs_hier_phase_r_steps: 2000000
  rfs_hier_phase_j_steps: 0
  rfs_hier_phase_j_enabled: false
  rfs_hier_beta_ramp_steps: 50000
  rfs_hier_beta_target: 0.1
  rfs_hier_base_lane_probability: 0.5
  rfs_hier_min_branch_replay_transitions: 256
  # Co-training schedule fields: beta held at 0 for the first 50k of Phase R,
  # then ramped from 0.02 to the frozen target 0.1 over the next 50k.
  rfs_hier_beta_hold_steps: 50000
  rfs_hier_beta_floor: 0.02
  # Co-training model-level flags: QA_joint shadow in B (no boundary clone),
  # cross-lane replay 75/25, small pre-tanh residual exploration on the JOINT
  # lane (active only where beta > 0).  qa_base_cross_lane=false is the strict
  # version-A data-use policy (QA_base consumes BASE transitions only, per the
  # cross-lane principle: current action == executed action).
  rfs_hier_qa_joint_shadow_in_b: true
  rfs_hier_cross_lane_ratio: 0.25
  rfs_hier_qa_base_cross_lane: false
  rfs_hier_residual_exploration_std: 0.02

p6:
  # Frozen-DDIM Gaussian-prior prefill; no warm-start legacy actor.
  prefill_source: fresh_frozen_ddim
  init_checkpoint_id: fresh_frozen_ddim
  init_checkpoint_sha256: null
  # Not enforced for fresh (network_warmstart=True bypasses the step check);
  # kept present so the config contract remains complete.
  expected_init_checkpoint_steps: 0
