# @package _global_
# Explicit throughput overlay for new VS-Hier runs.
#
# It preserves the algorithm (K, UTD, replay semantics, sampling distribution,
# optimizer steps, and residual composition).  It only turns off redundant
# per-update runtime audits and coalesces the current K4/B256 QW teacher into
# one 1024-row microbatch. Checkpoint/evaluation cadence stays in the task
# configuration because it defines the learning-curve evidence. Never apply it
# to an already-running process or use it when strict per-update diagnostics
# are the experiment under test.
train:
  rfs_hier_runtime_contract_checks: false
  rfs_hier_qw_teacher_microbatch_size: 1024
